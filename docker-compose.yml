services:
  db:
    image: pgvector/pgvector:pg16
    container_name: portfolio_db
    restart: unless-stopped
    mem_limit: 1g          # <-- Duomenų bazei pakanka 1GB
    cpus: 1.0              # <-- 1 branduolys
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: portfolio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'  # Galite pašalinti, jei nereikia išorinės prieigos
    networks:
      - internal_net

  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: socket-proxy
    restart: unless-stopped
    mem_limit: 64m         # <-- Labai lengvas servisas
    cpus: 0.1              # <-- Jam beveik nereikia CPU
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - POST=0
    networks:
      - internal_net

  web:
    build:
      context: .
      args:
        - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
        - FB_APP_ID=${FB_APP_ID}
    container_name: resume_website
    restart: unless-stopped
    mem_limit: 1g          # <-- Next.js serveriui pakanka 1GB
    cpus: 1.0              # <-- 1 branduolys
    env_file:
      - .env
    environment:
      - HOMELAB_DATABASE_URL=${HOMELAB_DATABASE_URL}
      - DOCKER_HOST=tcp://socket-proxy:2375
    volumes:
      - /proc:/host/proc:ro
    depends_on:
      db:
        condition: service_started
      socket-proxy:
        condition: service_started
    ports:
      - '8080:3000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:3000/en']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - internal_net

networks:
  internal_net:
    driver: bridge

volumes:
  postgres_data: