services:
  db:
    image: postgres:16-alpine
    container_name: portfolio_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: portfolio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - internal_net

  # --- NAUJAS SAUGUS DOCKER PROXY ---
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: socket-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1 # Leidžiame tik skaityti konteinerių sąrašą
      - POST=0       # Draudžiame bet kokius keitimus
    networks:
      - internal_net
    # Jokių ports: čia nereikia, nes jis pasiekiamas tik vidiniame tinkle

  web:
    build:
      context: .
      args:
        - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
        - FB_APP_ID=${FB_APP_ID}
    container_name: resume_website
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HOMELAB_DATABASE_URL=${HOMELAB_DATABASE_URL}
    volumes:
      - /proc:/host/proc:ro
    depends_on:
      db:
        condition: service_started
      socket-proxy:
        condition: service_started
    ports:
      - "8080:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/en"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - internal_net

networks:
  internal_net:
    driver: bridge

volumes:
  postgres_data: