name: Deploy to Raspberry Pi

on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull latest changes
        run: |
          git pull --rebase origin main

      # ── 1. IŠVALYMAS (prieš .env kūrimą) ─────────────────────────────────
      - name: Clean workspace
        run: |
          git reset --hard HEAD
          git clean -fd

      # ── 2. .ENV KŪRIMAS ──────────────────────────────────────────────────
      - name: Create .env
        env:
          RS_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          RS_TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          RS_NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          RS_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RS_CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          RS_FB_APP_ID: ${{ secrets.FB_APP_ID }}
          RS_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RS_GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RS_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          RS_HOMELAB_DATABASE_URL: ${{ secrets.HOMELAB_DATABASE_URL }}
          RS_ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          RS_PROMETHEUS_URL: ${{ secrets.PROMETHEUS_URL }}
          RS_VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: |
          cd ${{ github.workspace }}
          echo "GEMINI_API_KEY=$RS_GEMINI_KEY" > .env
          echo "TURNSTILE_SECRET_KEY=$RS_TURNSTILE_SECRET_KEY" >> .env
          echo "NEXT_PUBLIC_TURNSTILE_SITE_KEY=$RS_NEXT_PUBLIC_TURNSTILE_SITE_KEY" >> .env
          echo "RESEND_API_KEY=$RS_RESEND_API_KEY" >> .env
          echo "CONTACT_EMAIL=$RS_CONTACT_EMAIL" >> .env
          echo "FB_APP_ID=$RS_FB_APP_ID" >> .env
          echo "ANTHROPIC_API_KEY=$RS_ANTHROPIC_API_KEY" >> .env
          echo "GH_TOKEN=$RS_GH_TOKEN" >> .env
          echo "DATABASE_URL=postgresql://portfolio:$RS_DB_PASSWORD@db:5432/portfolio" >> .env
          echo "HOMELAB_DATABASE_URL=\"$RS_HOMELAB_DATABASE_URL\"" >> .env
          echo "DB_PASSWORD=$RS_DB_PASSWORD" >> .env
          echo "ANTHROPIC_MODEL=$RS_ANTHROPIC_MODEL" >> .env
          echo "PROMETHEUS_URL=$RS_PROMETHEUS_URL" >> .env
          echo "VOYAGE_API_KEY=$RS_VOYAGE_API_KEY" >> .env

          cp .env frontend/.env
          echo "✅ .env created successfully"

      # ── 3. PRIKLAUSOMYBIŲ ĮDIEGIMAS (vieną kartą) ────────────────────────
      - name: Install dependencies
        run: cd frontend && npm ci --legacy-peer-deps

      # ── 4. VERTIMAI ──────────────────────────────────────────────────────
      - name: Translate content
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: cd frontend && node scripts/translate.mjs

      - name: Commit translated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f frontend/messages/lt.json frontend/public/about_me.lt.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update translations [skip ci]"
            git push
          else
            echo "No translation changes to commit."
          fi

      # ── 5. BUILD IR RESTART ──────────────────────────────────────────────
      - name: Build and Restart
        run: |
          DOCKER_BUILDKIT=1 docker compose build \
            --build-arg NEXT_PUBLIC_TURNSTILE_SITE_KEY="${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}" \
            --build-arg ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"

          # Perkuriame TIK resume_website, o ne visus konteinerius
          docker compose up -d --force-recreate web

          docker image prune -f
          echo "✅ Container started"

      # ── 6. MIGRACIJOS (be papildomo npm ci) ──────────────────────────────
      - name: Run Migrations
        env:
          DATABASE_URL: postgresql://portfolio:${{ secrets.DB_PASSWORD }}@localhost:5432/portfolio
        run: |
          sleep 10
          cd ${{ github.workspace }}/frontend
          npx prisma migrate deploy || echo "⚠️ Migration skipped or already applied"
          echo "✅ Migrations applied"

      # ── 7. PATIKRINIMAS ──────────────────────────────────────────────────
      - name: Verify Deployment
        run: |
          echo "Waiting for container to be healthy..."
          for i in $(seq 1 12); do
            STATUS=$(docker inspect --format='{{json .State.Health.Status}}' resume_website)
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "\"healthy\"" ]; then
              echo "✅ Website is UP and Healthy!"
              exit 0
            fi
            sleep 10
          done
          echo "❌ Website failed to become healthy"
          docker logs resume_website --tail 50
          exit 1

      # ── 8. NAUJA: TINKLARAŠČIO INDEKSAVIMAS (RAG) ─────────────────────────
      - name: Index Blog Posts for AI
        env:
          DATABASE_URL: postgresql://portfolio:${{ secrets.DB_PASSWORD }}@localhost:5432/portfolio
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: |
          echo "🧠 Pradedame tinklaraščio straipsnių indeksavimą..."
          cd ${{ github.workspace }}/frontend
          npx tsx scripts/index-blog.ts
          echo "✅ Tinklaraščio straipsniai sėkmingai indeksuoti!"

      # LIGHTHOUSE
      - name: Set Lighthouse Output Dir
        run: echo "LHCI_OUTPUT_DIR=${{ github.workspace }}/.lighthouseci" >> $GITHUB_ENV

      # ── 9. LIGHTHOUSE TESTAVIMAS ─────────────────────────────────────────
      - name: Run Lighthouse CI
        run: npx lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          LHCI_OUTPUT_DIR: ${{ github.workspace }}/.lighthouseci

      # ── 10. LIGHTHOUSE REZULTATŲ SUVESTINĖ ────────────────────────────────
      - name: Lighthouse Report Summary
        if: always()
        run: |
          echo "### 📊 Lighthouse CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Ieškome failo keliose galimose vietose
          MANIFEST=""
          if [ -f .lighthouseci/manifest.json ]; then
            MANIFEST=".lighthouseci/manifest.json"
          elif [ -f "${{ github.workspace }}/.lighthouseci/manifest.json" ]; then
            MANIFEST="${{ github.workspace }}/.lighthouseci/manifest.json"
          elif [ -f "$HOME/.lighthouseci/manifest.json" ]; then
            MANIFEST="$HOME/.lighthouseci/manifest.json"
          fi

          if [ -n "$MANIFEST" ]; then
            echo "✅ Radau rezultatus: $MANIFEST" >> $GITHUB_STEP_SUMMARY
            cat "$MANIFEST" | jq -r '.[] | "**\(.url)**\n- Performance: \(.summary.performance * 100)\n- Accessibility: \(.summary.accessibility * 100)\n- Best Practices: \(.summary.[\"best-practices\"] * 100)\n- SEO: \(.summary.seo * 100)\n"' >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Nepavyko rasti Lighthouse rezultatų failo." >> $GITHUB_STEP_SUMMARY
            echo "Patikrinkite šiuos katalogus:" >> $GITHUB_STEP_SUMMARY
            ls -la .lighthouseci/ 2>/dev/null || echo "Nėra .lighthouseci/" >> $GITHUB_STEP_SUMMARY
            ls -la $HOME/.lighthouseci/ 2>/dev/null || echo "Nėra ~/.lighthouseci/" >> $GITHUB_STEP_SUMMARY
          fi
